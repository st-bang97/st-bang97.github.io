<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">SAFE: how it works</title><desc id="d">Side-by-side comparison. The default UVM prefetcher applies one rule to every block, which over-fetches on irregular access. SAFE tracks how many SMs share each block through uTLBs and prefetches aggressively only for widely shared blocks.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#334155"/></marker><marker id="a-gpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-cpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f766e"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-host" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-vio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fef2f2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#fecaca" stroke-width="3"/></pattern><pattern id="hatchG" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f1f5f9"/><line x1="0" y1="0" x2="0" y2="7" stroke="#e2e8f0" stroke-width="3"/></pattern><pattern id="hatchT" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ccfbf1"/><line x1="0" y1="0" x2="0" y2="7" stroke="#99f6e4" stroke-width="3"/></pattern></defs><style>text{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style><rect width="760" height="420" fill="#ffffff"/><rect x="14.0" y="12.0" width="360.0" height="330.0" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="30.0" y="24.0" width="152.7" height="24.0" rx="12.0" fill="#e2e8f0" stroke="none" stroke-width="1"/><text x="106.3" y="40.3" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Default UVM prefetcher</text><text x="30.0" y="70.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">One fixed prefetch rule for every block</text><text x="30.0" y="104.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">Regular access</text><rect x="30.0" y="114.0" width="26.0" height="26.0" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/><rect x="61.0" y="114.0" width="26.0" height="26.0" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/><rect x="92.0" y="114.0" width="26.0" height="26.0" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/><rect x="123.0" y="114.0" width="26.0" height="26.0" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/><rect x="154.0" y="114.0" width="26.0" height="26.0" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/><rect x="185.0" y="114.0" width="26.0" height="26.0" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/><text x="222.0" y="132.0" font-size="11.5" font-weight="600" fill="#166534" text-anchor="start">prefetch pays off</text><text x="30.0" y="186.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">Irregular access</text><rect x="30.0" y="196.0" width="26.0" height="26.0" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/><rect x="61.0" y="196.0" width="26.0" height="26.0" rx="4" fill="url(#hatch)" stroke="#fca5a5" stroke-width="1"/><rect x="92.0" y="196.0" width="26.0" height="26.0" rx="4" fill="url(#hatch)" stroke="#fca5a5" stroke-width="1"/><rect x="123.0" y="196.0" width="26.0" height="26.0" rx="4" fill="url(#hatch)" stroke="#fca5a5" stroke-width="1"/><rect x="154.0" y="196.0" width="26.0" height="26.0" rx="4" fill="url(#hatch)" stroke="#fca5a5" stroke-width="1"/><rect x="185.0" y="196.0" width="26.0" height="26.0" rx="4" fill="url(#hatch)" stroke="#fca5a5" stroke-width="1"/><text x="222.0" y="208.0" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="start">over-fetch:</text><text x="222.0" y="224.0" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="start">wasted PCIe and HBM</text><text x="30.0" y="290.0" font-size="12" font-weight="600" fill="#334155" text-anchor="start">Irregular and mixed workloads</text><text x="30.0" y="308.0" font-size="12" font-weight="600" fill="#334155" text-anchor="start">suffer from one-size-fits-all prefetching.</text><rect x="386.0" y="12.0" width="360.0" height="330.0" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="402.0" y="24.0" width="52.0" height="24.0" rx="12.0" fill="#2563eb" stroke="none" stroke-width="1"/><text x="428.0" y="40.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">SAFE</text><text x="402.0" y="70.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Track which SMs share each block (via uTLBs)</text><rect x="402.0" y="84.0" width="48.0" height="24.0" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="426.0" y="100.1" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">SM0</text><rect x="460.0" y="84.0" width="48.0" height="24.0" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="484.0" y="100.1" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">SM1</text><rect x="518.0" y="84.0" width="48.0" height="24.0" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="542.0" y="100.1" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">SM2</text><rect x="576.0" y="84.0" width="48.0" height="24.0" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="600.0" y="100.1" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">SM3</text><rect x="412.0" y="142.0" width="110.0" height="28.0" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="467.0" y="160.3" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">Block A</text><rect x="574.0" y="142.0" width="110.0" height="28.0" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="629.0" y="160.3" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Block B</text><path d="M 426 108 L 467 140" fill="none" stroke="#2563eb" stroke-width="1.2" marker-end="url(#a-gpu)"/><path d="M 484 108 L 467 140" fill="none" stroke="#2563eb" stroke-width="1.2" marker-end="url(#a-gpu)"/><path d="M 542 108 L 467 140" fill="none" stroke="#2563eb" stroke-width="1.2" marker-end="url(#a-gpu)"/><path d="M 600 108 L 467 140" fill="none" stroke="#2563eb" stroke-width="1.2" marker-end="url(#a-gpu)"/><path d="M 600 108 L 629 140" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-host)"/><text x="467.0" y="188.0" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">shared by many SMs</text><text x="629.0" y="188.0" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">touched by one SM</text><text x="402.0" y="222.0" font-size="12" font-weight="700" fill="#166534" text-anchor="start">Prefetch aggressively</text><rect x="402.0" y="230.0" width="22.0" height="22.0" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/><rect x="428.0" y="230.0" width="22.0" height="22.0" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/><rect x="454.0" y="230.0" width="22.0" height="22.0" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/><rect x="480.0" y="230.0" width="22.0" height="22.0" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/><rect x="506.0" y="230.0" width="22.0" height="22.0" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/><rect x="532.0" y="230.0" width="22.0" height="22.0" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/><text x="402.0" y="284.0" font-size="12" font-weight="700" fill="#166534" text-anchor="start">Prefetch conservatively</text><rect x="402.0" y="292.0" width="22.0" height="22.0" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/><rect x="428.0" y="292.0" width="22.0" height="22.0" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/><rect x="454.0" y="292.0" width="22.0" height="22.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/><rect x="480.0" y="292.0" width="22.0" height="22.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/><rect x="506.0" y="292.0" width="22.0" height="22.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/><rect x="532.0" y="292.0" width="22.0" height="22.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/><text x="566.0" y="248.0" font-size="11.5" font-weight="600" fill="#334155" text-anchor="start">regular</text><text x="566.0" y="310.0" font-size="11.5" font-weight="600" fill="#334155" text-anchor="start">irregular</text><text x="30.0" y="370.0" font-size="12" font-weight="600" fill="#334155" text-anchor="start">vs. the default UVM prefetcher, irregular workloads</text><rect x="616.3" y="356.0" width="113.7" height="24.0" rx="12.0" fill="#0f172a" stroke="none" stroke-width="1"/><text x="673.2" y="372.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Up to 6.5× faster</text><rect x="586.7" y="388.0" width="143.3" height="24.0" rx="12.0" fill="#dbeafe" stroke="none" stroke-width="1"/><text x="658.3" y="404.3" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">no hardware changes</text><rect x="468.3" y="388.0" width="110.4" height="24.0" rx="12.0" fill="#dcfce7" stroke="none" stroke-width="1"/><text x="523.5" y="404.3" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3.6× on average</text><rect x="30.0" y="394.0" width="14.0" height="12.0" rx="3" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/><text x="50.0" y="404.0" font-size="12" font-weight="500" fill="#334155" text-anchor="start">demanded</text><rect x="128.7" y="394.0" width="14.0" height="12.0" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/><text x="148.7" y="404.0" font-size="12" font-weight="500" fill="#334155" text-anchor="start">prefetched, used</text><rect x="260.1" y="394.0" width="14.0" height="12.0" rx="3" fill="url(#hatch)" stroke="#fca5a5" stroke-width="1"/><text x="280.1" y="404.0" font-size="12" font-weight="500" fill="#334155" text-anchor="start">prefetched, wasted</text></svg>
