<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">ReFlow: how it works</title><desc id="d">Timeline comparison. In ZeRO-Infinity the GPU idles while the CPU runs a serialized optimizer update. In ReFlow, BF16 gradients are processed during the backward pass, BF16 parameters are ready when the next step starts, and FP32 state is persisted while the GPU computes.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#334155"/></marker><marker id="a-gpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-cpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f766e"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-host" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-vio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fef2f2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#fecaca" stroke-width="3"/></pattern><pattern id="hatchG" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f1f5f9"/><line x1="0" y1="0" x2="0" y2="7" stroke="#e2e8f0" stroke-width="3"/></pattern><pattern id="hatchT" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ccfbf1"/><line x1="0" y1="0" x2="0" y2="7" stroke="#99f6e4" stroke-width="3"/></pattern></defs><style>text{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style><rect width="760" height="420" fill="#ffffff"/><rect x="14.0" y="12.0" width="732.0" height="180.0" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="30.0" y="24.0" width="152.0" height="24.0" rx="12.0" fill="#e2e8f0" stroke="none" stroke-width="1"/><text x="106.0" y="40.3" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Baseline: ZeRO-Infinity</text><text x="730.0" y="41.0" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="end">GPU waits for the host: up to 47.9% of an iteration</text><text x="30.0" y="82.0" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start">GPU</text><text x="30.0" y="138.0" font-size="13" font-weight="700" fill="#134e4a" text-anchor="start">CPU</text><rect x="84.0" y="60.0" width="646.0" height="34.0" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="84.0" y="116.0" width="646.0" height="34.0" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="84.0" y="60.0" width="112.0" height="34.0" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="140.0" y="81.7" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">Forward</text><rect x="196.0" y="60.0" width="170.0" height="34.0" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="281.0" y="81.7" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">Backward</text><rect x="366.0" y="60.0" width="196.0" height="34.0" rx="7" fill="url(#hatch)" stroke="#fca5a5" stroke-width="1"/><text x="464.0" y="81.7" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">GPU idle</text><rect x="562.0" y="60.0" width="168.0" height="34.0" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="646.0" y="81.7" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">Forward (next step)</text><line x1="90" y1="138.0" x2="360" y2="138.0" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 5"/><text x="225.0" y="131.0" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">CPU mostly idle</text><rect x="366.0" y="116.0" width="196.0" height="34.0" rx="7" fill="#0d9488" stroke="#0f766e" stroke-width="1"/><text x="464.0" y="137.7" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Host optimizer update</text><line x1="562.0" y1="118.0" x2="562.0" y2="97.0" stroke="#0f766e" stroke-width="1.8" marker-end="url(#a-cpu)"/><text x="570.0" y="112.0" font-size="11" font-weight="600" fill="#134e4a" text-anchor="start">BF16 params</text><text x="84.0" y="176.0" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Serialized update writes every intermediate to DRAM: non-arithmetic work is about 5× the Adam math.</text><rect x="14.0" y="206.0" width="732.0" height="180.0" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="30.0" y="218.0" width="62.7" height="24.0" rx="12.0" fill="#2563eb" stroke="none" stroke-width="1"/><text x="61.3" y="234.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">ReFlow</text><text x="730.0" y="235.0" font-size="12" font-weight="700" fill="#166534" text-anchor="end">No exposed host update</text><text x="30.0" y="276.0" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start">GPU</text><text x="30.0" y="332.0" font-size="13" font-weight="700" fill="#134e4a" text-anchor="start">CPU</text><rect x="84.0" y="254.0" width="646.0" height="34.0" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="84.0" y="310.0" width="646.0" height="34.0" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="84.0" y="254.0" width="112.0" height="34.0" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="140.0" y="275.7" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">Forward</text><rect x="196.0" y="254.0" width="170.0" height="34.0" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="281.0" y="275.7" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">Backward</text><rect x="366.0" y="254.0" width="168.0" height="34.0" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="450.0" y="275.7" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">Forward (next step)</text><rect x="534.0" y="254.0" width="196.0" height="34.0" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="632.0" y="275.7" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">Backward (next step)</text><line x1="90" y1="332.0" x2="190" y2="332.0" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 5"/><text x="140.0" y="325.0" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">idle</text><rect x="196.0" y="310.0" width="100.0" height="34.0" rx="7" fill="#ccfbf1" stroke="#5eead4" stroke-width="1"/><text x="246.0" y="331.3" font-size="12" font-weight="600" fill="#134e4a" text-anchor="middle">BF16 grads</text><rect x="296.0" y="310.0" width="70.0" height="34.0" rx="7" fill="#0d9488" stroke="#0f766e" stroke-width="1"/><text x="331.0" y="331.3" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Ready</text><rect x="366.0" y="310.0" width="168.0" height="34.0" rx="7" fill="#ccfbf1" stroke="#5eead4" stroke-width="1" stroke-dasharray="5 3"/><text x="450.0" y="331.3" font-size="12" font-weight="600" fill="#134e4a" text-anchor="middle">Persist FP32 (deferred)</text><line x1="366.0" y1="312.0" x2="366.0" y2="291.0" stroke="#0f766e" stroke-width="1.8" marker-end="url(#a-cpu)"/><text x="372.0" y="306.0" font-size="11" font-weight="600" fill="#134e4a" text-anchor="start">BF16 params ready</text><text x="84.0" y="370.0" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Fused SIMD update overlaps the backward pass; FP32 state is persisted while the GPU computes.</text><rect x="30.0" y="399.0" width="14.0" height="12.0" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="50.0" y="409.0" font-size="12" font-weight="500" fill="#334155" text-anchor="start">GPU compute</text><rect x="147.3" y="399.0" width="14.0" height="12.0" rx="3" fill="#0d9488" stroke="#0f766e" stroke-width="1"/><text x="167.3" y="409.0" font-size="12" font-weight="500" fill="#334155" text-anchor="start">CPU work</text><rect x="243.4" y="399.0" width="14.0" height="12.0" rx="3" fill="url(#hatch)" stroke="#fca5a5" stroke-width="1"/><text x="263.4" y="409.0" font-size="12" font-weight="500" fill="#334155" text-anchor="start">GPU idle</text><rect x="567.0" y="394.0" width="163.0" height="24.0" rx="12.0" fill="#0f172a" stroke="none" stroke-width="1"/><text x="648.5" y="410.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Up to 4× vs ZeRO-Infinity</text><rect x="415.0" y="394.0" width="144.0" height="24.0" rx="12.0" fill="#dcfce7" stroke="none" stroke-width="1"/><text x="487.0" y="410.3" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">98% of ZeRO-3 at 50B</text></svg>
