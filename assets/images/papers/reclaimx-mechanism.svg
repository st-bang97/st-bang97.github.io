<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">ReclaimX: how it works</title><desc id="d">Side-by-side comparison. In baseline UVM a far-page fault stalls a TPC while the host driver selects victims at 2 MB granularity and evicts far more data than the demand fetch. In ReclaimX the stalled TPC itself picks a cold 64 KB block, compresses it inside HBM or evicts it, and later accesses are restored locally on the GPU.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#334155"/></marker><marker id="a-gpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-cpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f766e"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-host" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-vio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fef2f2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#fecaca" stroke-width="3"/></pattern><pattern id="hatchG" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f1f5f9"/><line x1="0" y1="0" x2="0" y2="7" stroke="#e2e8f0" stroke-width="3"/></pattern><pattern id="hatchT" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ccfbf1"/><line x1="0" y1="0" x2="0" y2="7" stroke="#99f6e4" stroke-width="3"/></pattern></defs><style>text{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style><rect width="760" height="420" fill="#ffffff"/><rect x="14.0" y="12.0" width="360.0" height="330.0" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="30.0" y="24.0" width="99.3" height="24.0" rx="12.0" fill="#e2e8f0" stroke="none" stroke-width="1"/><text x="79.7" y="40.3" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Baseline UVM</text><rect x="30.0" y="60.0" width="328.0" height="128.0" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/><text x="44.0" y="80.0" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="start">GPU</text><rect x="44.0" y="100.0" width="38.0" height="30.0" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><rect x="90.0" y="100.0" width="38.0" height="30.0" rx="5" fill="url(#hatch)" stroke="#fca5a5" stroke-width="1"/><rect x="136.0" y="100.0" width="38.0" height="30.0" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><rect x="182.0" y="100.0" width="38.0" height="30.0" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><rect x="228.0" y="100.0" width="38.0" height="30.0" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><rect x="274.0" y="100.0" width="38.0" height="30.0" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="44.0" y="93.0" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="start">TPCs</text><text x="109.0" y="146.0" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">stalled, idle</text><rect x="44.0" y="154.0" width="300.0" height="22.0" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="194.0" y="169.0" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">HBM full</text><rect x="30.0" y="250.0" width="328.0" height="80.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="44.0" y="272.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">Host CPU (UVM driver)</text><text x="44.0" y="292.0" font-size="11.5" font-weight="500" fill="#334155" text-anchor="start">picks victims from 2 MB region history</text><text x="44.0" y="311.0" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="start">~19 µs before the first eviction starts</text><path d="M 109 132 L 109 246" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#a-bad)"/><text x="116.0" y="218.0" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="start">far-page fault</text><line x1="262.0" y1="178.0" x2="262.0" y2="246.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#a-host)"/><text x="256.0" y="214.0" font-size="11" font-weight="600" fill="#334155" text-anchor="end">evict</text><text x="256.0" y="228.0" font-size="11" font-weight="700" fill="#334155" text-anchor="end">1.67 MB</text><line x1="318.0" y1="248.0" x2="318.0" y2="180.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#a-host)"/><text x="324.0" y="214.0" font-size="11" font-weight="600" fill="#334155" text-anchor="start">fetch</text><text x="324.0" y="228.0" font-size="11" font-weight="700" fill="#334155" text-anchor="start">0.42 MB</text><rect x="386.0" y="12.0" width="360.0" height="330.0" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="402.0" y="24.0" width="74.0" height="24.0" rx="12.0" fill="#2563eb" stroke="none" stroke-width="1"/><text x="439.0" y="40.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">ReclaimX</text><rect x="402.0" y="60.0" width="328.0" height="234.0" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/><text x="416.0" y="80.0" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="start">GPU</text><rect x="416.0" y="100.0" width="38.0" height="30.0" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><rect x="462.0" y="100.0" width="38.0" height="30.0" rx="5" fill="#16a34a" stroke="#16a34a" stroke-width="1"/><rect x="508.0" y="100.0" width="38.0" height="30.0" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><rect x="554.0" y="100.0" width="38.0" height="30.0" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><rect x="600.0" y="100.0" width="38.0" height="30.0" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><rect x="646.0" y="100.0" width="38.0" height="30.0" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="416.0" y="93.0" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="start">TPCs</text><text x="490.0" y="148.0" font-size="11" font-weight="700" fill="#166534" text-anchor="start">the stalled TPC runs the reclaim kernel</text><rect x="416.0" y="156.0" width="140.0" height="40.0" rx="7" fill="#dcfce7" stroke="#86efac" stroke-width="1"/><text x="486.0" y="174.0" font-size="12" font-weight="600" fill="#166534" text-anchor="middle">Pick cold 64 KB</text><text x="486.0" y="189.0" font-size="11" font-weight="500" fill="#166534" text-anchor="middle">Two-Level LRU</text><line x1="556.0" y1="176.0" x2="578.0" y2="176.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a-good)"/><rect x="580.0" y="156.0" width="136.0" height="40.0" rx="7" fill="#dcfce7" stroke="#86efac" stroke-width="1"/><text x="648.0" y="174.0" font-size="12" font-weight="600" fill="#166534" text-anchor="middle">Compress in HBM</text><text x="648.0" y="189.0" font-size="11" font-weight="500" fill="#166534" text-anchor="middle">or evict if needed</text><path d="M 481 132 L 481 154" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-good)"/><text x="416.0" y="222.0" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="start">HBM</text><rect x="446.0" y="210.0" width="150.0" height="22.0" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="521.0" y="225.0" font-size="11.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">raw</text><rect x="596.0" y="210.0" width="72.0" height="22.0" rx="4" fill="url(#hatchT)" stroke="#5eead4" stroke-width="1"/><text x="632.0" y="225.0" font-size="10.5" font-weight="700" fill="#134e4a" text-anchor="middle">compressed</text><rect x="668.0" y="210.0" width="48.0" height="22.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="692.0" y="225.0" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">free</text><path d="M 648 198 L 640 207" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a-good)"/><path d="M 626 236 C 612 266, 548 268, 530 238" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#a-cpu)"/><text x="578.0" y="280.0" font-size="11.5" font-weight="700" fill="#134e4a" text-anchor="middle">later access: local restore on GPU</text><rect x="402.0" y="304.0" width="328.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/><text x="566.0" y="322.0" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="middle">Host memory: eviction only as a fallback</text><text x="30.0" y="370.0" font-size="12" font-weight="600" fill="#334155" text-anchor="start">vs. baseline UVM, 12 oversubscribed workloads</text><rect x="571.0" y="356.0" width="159.0" height="24.0" rx="12.0" fill="#0f172a" stroke="none" stroke-width="1"/><text x="650.5" y="372.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2.33× geomean speedup</text><rect x="551.0" y="388.0" width="179.0" height="24.0" rx="12.0" fill="#dcfce7" stroke="none" stroke-width="1"/><text x="640.5" y="404.3" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">up to 3.61× with prefetchers</text><rect x="400.3" y="388.0" width="142.7" height="24.0" rx="12.0" fill="#dbeafe" stroke="none" stroke-width="1"/><text x="471.7" y="404.3" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">90.6% fewer far faults</text><rect x="30.0" y="394.0" width="14.0" height="12.0" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="50.0" y="404.0" font-size="12" font-weight="500" fill="#334155" text-anchor="start">GPU / HBM</text><rect x="134.7" y="394.0" width="14.0" height="12.0" rx="3" fill="#16a34a" stroke="#16a34a" stroke-width="1"/><text x="154.7" y="404.0" font-size="12" font-weight="500" fill="#334155" text-anchor="start">Device-side reclaim</text><rect x="281.4" y="394.0" width="14.0" height="12.0" rx="3" fill="url(#hatch)" stroke="#fca5a5" stroke-width="1"/><text x="301.4" y="404.0" font-size="12" font-weight="500" fill="#334155" text-anchor="start">Stalled, idle</text></svg>
