<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">SAFE overview</title><desc id="desc">SAFE observes how a UVM memory block is shared across GPU SMs and selects a more or less aggressive prefetch configuration based on the observed sharing behavior.</desc>
<rect width="760" height="420" fill="#f7f8fa"/><text x="34" y="42" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17202b">SAFE</text><text x="34" y="68" font-family="Arial,sans-serif" font-size="13" fill="#66717e">Sharing-aware prefetching for Unified Virtual Memory</text>
<rect x="34" y="105" width="258" height="246" rx="14" fill="#fff" stroke="#cfd6de"/><text x="53" y="136" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17202b">Observe block sharing</text><rect x="55" y="166" width="76" height="56" rx="9" fill="#e9f1fa" stroke="#7f9fc4"/><text x="78" y="199" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#204f85">Block A</text><g fill="#eef0f2" stroke="#abb3bc"><rect x="166" y="155" width="40" height="34" rx="6"/><rect x="219" y="155" width="40" height="34" rx="6"/><rect x="166" y="204" width="40" height="34" rx="6"/><rect x="219" y="204" width="40" height="34" rx="6"/></g><text x="176" y="176" font-family="Arial,sans-serif" font-size="10" fill="#4e5965">SM0</text><text x="229" y="176" font-family="Arial,sans-serif" font-size="10" fill="#4e5965">SM1</text><text x="176" y="225" font-family="Arial,sans-serif" font-size="10" fill="#4e5965">SM2</text><text x="229" y="225" font-family="Arial,sans-serif" font-size="10" fill="#4e5965">SM3</text><g stroke="#7f9fc4" stroke-width="2"><line x1="131" y1="182" x2="166" y2="172"/><line x1="131" y1="187" x2="219" y2="172"/><line x1="131" y1="198" x2="166" y2="221"/><line x1="131" y1="202" x2="219" y2="221"/></g><text x="54" y="280" font-family="Arial,sans-serif" font-size="11" fill="#66717e">uTLB observations estimate</text><text x="54" y="301" font-family="Arial,sans-serif" font-size="11" fill="#66717e">sharing / access regularity</text>
<path d="M292 227 H354" stroke="#7c8792" stroke-width="2"/><polygon points="354,227 344,221 345,233" fill="#7c8792"/>
<rect x="354" y="105" width="372" height="246" rx="14" fill="#fff7ec" stroke="#ddb26f"/><text x="375" y="136" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7c541d">Adapt prefetch aggressiveness</text><text x="375" y="172" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#35663e">Highly shared / regular block</text><rect x="375" y="187" width="282" height="36" rx="7" fill="#e2f0e5"/><g fill="#8ab493"><rect x="390" y="197" width="38" height="16" rx="3"/><rect x="435" y="197" width="38" height="16" rx="3"/><rect x="480" y="197" width="38" height="16" rx="3"/><rect x="525" y="197" width="38" height="16" rx="3"/><rect x="570" y="197" width="38" height="16" rx="3"/></g><text x="616" y="210" font-family="Arial,sans-serif" font-size="10" fill="#52715a">more</text><text x="375" y="264" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#88561f">Lightly shared / irregular block</text><rect x="375" y="279" width="282" height="36" rx="7" fill="#f3eee7"/><g fill="#c8beb1"><rect x="390" y="289" width="38" height="16" rx="3"/><rect x="435" y="289" width="38" height="16" rx="3"/></g><text x="616" y="302" font-family="Arial,sans-serif" font-size="10" fill="#715d47">less</text>
