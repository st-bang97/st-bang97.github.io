<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">SAFE: key idea</title><desc id="d">Key insight: how widely a memory block is shared across GPU SMs predicts whether prefetching it pays off. The default UVM prefetcher applies one setting to every block; SAFE chooses a setting per block from sharing status read from existing uTLBs.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#334155"/></marker><marker id="a-gpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-cpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f766e"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-host" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-vio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fef2f2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#fecaca" stroke-width="3"/></pattern><pattern id="hatchG" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f1f5f9"/><line x1="0" y1="0" x2="0" y2="7" stroke="#e2e8f0" stroke-width="3"/></pattern><pattern id="hatchT" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ccfbf1"/><line x1="0" y1="0" x2="0" y2="7" stroke="#99f6e4" stroke-width="3"/></pattern></defs><style>text{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style><rect width="760" height="420" fill="#ffffff"/><rect x="14.0" y="12.0" width="732.0" height="118.0" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="28.0" y="24.0" width="84.7" height="24.0" rx="12.0" fill="#2563eb" stroke="none" stroke-width="1"/><text x="70.3" y="40.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Key insight</text><text x="28.0" y="72.0" font-size="16" font-weight="800" fill="#0f172a" text-anchor="start">How widely a block is shared across SMs predicts if prefetching pays off.</text><rect x="28.0" y="86.0" width="190.0" height="30.0" rx="15" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="123.0" y="105.5" font-size="12.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">shared by many SMs</text><line x1="222.0" y1="101.0" x2="246.0" y2="101.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-gpu)"/><rect x="250.0" y="86.0" width="116.0" height="30.0" rx="15" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/><text x="308.0" y="105.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">prefetch more</text><rect x="392.0" y="86.0" width="190.0" height="30.0" rx="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="487.0" y="105.5" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">touched by one SM</text><line x1="586.0" y1="101.0" x2="610.0" y2="101.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#a-host)"/><rect x="614.0" y="86.0" width="118.0" height="30.0" rx="15" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="673.0" y="105.5" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">prefetch less</text><rect x="176.0" y="142.0" width="281.0" height="28.0" rx="8" fill="#f1f5f9" stroke="none" stroke-width="1"/><text x="190.0" y="161.0" font-size="12.5" font-weight="800" fill="#334155" text-anchor="start">Default UVM prefetcher</text><rect x="461.0" y="142.0" width="285.0" height="28.0" rx="8" fill="#dbeafe" stroke="none" stroke-width="1"/><text x="475.0" y="161.0" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="start">SAFE</text><line x1="14" y1="176" x2="746" y2="176" stroke="#e2e8f0"/><text x="28.0" y="202.7" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Prefetch policy</text><circle cx="198" cy="198.66666666666666" r="8" fill="#fee2e2"/><path d="M 195 195.66666666666666 L 201 201.66666666666666 M 201 195.66666666666666 L 195 201.66666666666666" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="202.7" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">One setting for every block</text><circle cx="483" cy="198.66666666666666" r="8" fill="#16a34a"/><path d="M 479.4 198.86666666666665 L 482.1 201.56666666666666 L 487 196.06666666666666" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="202.7" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">A setting per block, chosen by its</text><text x="499.0" y="218.7" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">sharing status</text><line x1="14" y1="241.33333333333331" x2="746" y2="241.33333333333331" stroke="#e2e8f0"/><text x="28.0" y="268.0" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Signal used</text><circle cx="198" cy="264.0" r="8" fill="#fee2e2"/><path d="M 195 261.0 L 201 267.0 M 201 261.0 L 195 267.0" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="268.0" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">Neighboring faults with a fixed threshold</text><circle cx="483" cy="264.0" r="8" fill="#16a34a"/><path d="M 479.4 264.2 L 482.1 266.9 L 487 261.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="268.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Sharing across SMs, read from existing</text><text x="499.0" y="284.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">uTLBs</text><line x1="14" y1="306.66666666666663" x2="746" y2="306.66666666666663" stroke="#e2e8f0"/><text x="28.0" y="333.3" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Irregular workloads</text><circle cx="198" cy="329.3333333333333" r="8" fill="#fee2e2"/><path d="M 195 326.3333333333333 L 201 332.3333333333333 M 201 326.3333333333333 L 195 332.3333333333333" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="333.3" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">Over-fetch wastes PCIe bandwidth and</text><text x="214.0" y="349.3" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">GPU memory</text><circle cx="483" cy="329.3333333333333" r="8" fill="#16a34a"/><path d="M 479.4 329.5333333333333 L 482.1 332.2333333333333 L 487 326.7333333333333" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="333.3" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Prefetch only where it pays off</text><line x1="14" y1="371.99999999999994" x2="746" y2="371.99999999999994" stroke="#e2e8f0"/><rect x="602.7" y="386.0" width="143.3" height="24.0" rx="12.0" fill="#dbeafe" stroke="none" stroke-width="1"/><text x="674.3" y="402.3" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">no hardware changes</text><rect x="484.3" y="386.0" width="110.4" height="24.0" rx="12.0" fill="#dcfce7" stroke="none" stroke-width="1"/><text x="539.5" y="402.3" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3.6× on average</text><rect x="362.6" y="386.0" width="113.7" height="24.0" rx="12.0" fill="#0f172a" stroke="none" stroke-width="1"/><text x="419.5" y="402.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Up to 6.5× faster</text><text x="14.0" y="402.0" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">vs. the default UVM prefetcher, on irregular workloads</text></svg>
