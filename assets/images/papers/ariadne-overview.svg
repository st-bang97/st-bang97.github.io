<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">ARIADNE: key idea</title><desc id="d">Key insight: the UVM driver can measure how widely threads share each memory region at runtime and use it to migrate shared regions and read the rest in place. Unlike prior approaches, ARIADNE needs no hardware or compiler changes, hides migration latency, and avoids thrashing.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#334155"/></marker><marker id="a-gpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-cpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f766e"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-host" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-vio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fef2f2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#fecaca" stroke-width="3"/></pattern><pattern id="hatchG" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f1f5f9"/><line x1="0" y1="0" x2="0" y2="7" stroke="#e2e8f0" stroke-width="3"/></pattern><pattern id="hatchT" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ccfbf1"/><line x1="0" y1="0" x2="0" y2="7" stroke="#99f6e4" stroke-width="3"/></pattern></defs><style>text{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style><rect width="760" height="420" fill="#ffffff"/><rect x="14.0" y="12.0" width="732.0" height="118.0" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="28.0" y="24.0" width="84.7" height="24.0" rx="12.0" fill="#2563eb" stroke="none" stroke-width="1"/><text x="70.3" y="40.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Key insight</text><text x="28.0" y="72.0" font-size="16" font-weight="800" fill="#0f172a" text-anchor="start">Decide per region at runtime: migrate what threads share, read the rest in place.</text><rect x="28.0" y="86.0" width="206.0" height="30.0" rx="15" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="131.0" y="105.5" font-size="12.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">shared by many threads</text><line x1="238.0" y1="101.0" x2="262.0" y2="101.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-gpu)"/><rect x="266.0" y="86.0" width="118.0" height="30.0" rx="15" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/><text x="325.0" y="105.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">migrate</text><rect x="410.0" y="86.0" width="180.0" height="30.0" rx="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="500.0" y="105.5" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">used by one thread</text><line x1="594.0" y1="101.0" x2="618.0" y2="101.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#a-host)"/><rect x="622.0" y="86.0" width="110.0" height="30.0" rx="15" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="677.0" y="105.5" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">read in place</text><rect x="176.0" y="142.0" width="281.0" height="28.0" rx="8" fill="#f1f5f9" stroke="none" stroke-width="1"/><text x="190.0" y="161.0" font-size="12.5" font-weight="800" fill="#334155" text-anchor="start">Prior UVM approaches</text><rect x="461.0" y="142.0" width="285.0" height="28.0" rx="8" fill="#dbeafe" stroke="none" stroke-width="1"/><text x="475.0" y="161.0" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="start">ARIADNE</text><line x1="14" y1="176" x2="746" y2="176" stroke="#e2e8f0"/><text x="28.0" y="198.5" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Deployment</text><circle cx="198" cy="194.5" r="8" fill="#fee2e2"/><path d="M 195 191.5 L 201 197.5 M 201 191.5 L 195 197.5" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="198.5" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">Often needs hardware or compiler</text><text x="214.0" y="214.5" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">changes</text><circle cx="483" cy="194.5" r="8" fill="#16a34a"/><path d="M 479.4 194.7 L 482.1 197.4 L 487 191.9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="198.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Driver only: runs unmodified, even</text><text x="499.0" y="214.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">closed-source binaries</text><line x1="14" y1="233.0" x2="746" y2="233.0" stroke="#e2e8f0"/><text x="28.0" y="255.5" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Placement signal</text><circle cx="198" cy="251.5" r="8" fill="#fee2e2"/><path d="M 195 248.5 L 201 254.5 M 201 248.5 L 195 254.5" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="255.5" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">Faults, access counters, or static hints</text><circle cx="483" cy="251.5" r="8" fill="#16a34a"/><path d="M 479.4 251.7 L 482.1 254.4 L 487 248.9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="255.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Sharing Degree: thread-level locality</text><text x="499.0" y="271.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">measured live</text><line x1="14" y1="290.0" x2="746" y2="290.0" stroke="#e2e8f0"/><text x="28.0" y="312.5" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Fault handling</text><circle cx="198" cy="308.5" r="8" fill="#fee2e2"/><path d="M 195 305.5 L 201 311.5 M 201 305.5 L 195 311.5" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="312.5" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">Migration latency exposed</text><circle cx="483" cy="308.5" r="8" fill="#16a34a"/><path d="M 479.4 308.7 L 482.1 311.4 L 487 305.9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="312.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Pipelined to hide migration latency</text><line x1="14" y1="331.0" x2="746" y2="331.0" stroke="#e2e8f0"/><text x="28.0" y="353.5" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Heavy oversubscription</text><circle cx="198" cy="349.5" r="8" fill="#fee2e2"/><path d="M 195 346.5 L 201 352.5 M 201 346.5 L 195 352.5" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="353.5" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">Thrashing and sharp slowdowns</text><circle cx="483" cy="349.5" r="8" fill="#16a34a"/><path d="M 479.4 349.7 L 482.1 352.4 L 487 346.9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="353.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">No thrashing, near-linear scaling</text><line x1="14" y1="372.0" x2="746" y2="372.0" stroke="#e2e8f0"/><rect x="654.3" y="386.0" width="91.7" height="24.0" rx="12.0" fill="#dbeafe" stroke="none" stroke-width="1"/><text x="700.1" y="402.3" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">4.8× at 300%</text><rect x="554.6" y="386.0" width="91.7" height="24.0" rx="12.0" fill="#0f172a" stroke="none" stroke-width="1"/><text x="600.4" y="402.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5.0× at 175%</text><rect x="454.9" y="386.0" width="91.7" height="24.0" rx="12.0" fill="#dbeafe" stroke="none" stroke-width="1"/><text x="500.7" y="402.3" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">1.9× at 130%</text><text x="14.0" y="402.0" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Average speedup over a state-of-the-art method, by oversubscription ratio</text></svg>
