<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">ARIADNE overview</title><desc id="desc">ARIADNE pipelines UVM fault handling, measures runtime sharing degree, and adaptively places regions in GPU memory or zero-copy host memory.</desc>
<rect width="760" height="420" fill="#f7f8fa"/><text x="34" y="42" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17202b">ARIADNE</text><text x="34" y="68" font-family="Arial,sans-serif" font-size="13" fill="#66717e">Adaptive UVM management under memory oversubscription</text>
<rect x="34" y="107" width="215" height="232" rx="14" fill="#fff" stroke="#cfd6de"/><text x="53" y="137" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17202b">UVM fault stream</text><g fill="#e9f1fa" stroke="#7f9fc4"><rect x="53" y="162" width="47" height="41" rx="7"/><rect x="111" y="162" width="47" height="41" rx="7"/><rect x="169" y="162" width="47" height="41" rx="7"/></g><text x="66" y="187" font-family="Arial,sans-serif" font-size="11" fill="#204f85">F1</text><text x="124" y="187" font-family="Arial,sans-serif" font-size="11" fill="#204f85">F2</text><text x="182" y="187" font-family="Arial,sans-serif" font-size="11" fill="#204f85">F3</text><text x="53" y="235" font-family="Arial,sans-serif" font-size="11" fill="#66717e">Pipeline fault handling</text><text x="53" y="258" font-family="Arial,sans-serif" font-size="11" fill="#66717e">instead of serial recovery</text><path d="M55 286 H215" stroke="#7f9fc4" stroke-width="4" stroke-linecap="round"/><circle cx="88" cy="286" r="7" fill="#fff" stroke="#7f9fc4"/><circle cx="136" cy="286" r="7" fill="#fff" stroke="#7f9fc4"/><circle cx="184" cy="286" r="7" fill="#fff" stroke="#7f9fc4"/>
<path d="M249 223 H312" stroke="#7c8792" stroke-width="2"/><polygon points="312,223 302,217 303,229" fill="#7c8792"/>
<rect x="312" y="107" width="182" height="232" rx="14" fill="#fff7ec" stroke="#ddb26f"/><text x="332" y="137" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7c541d">Sharing Degree</text><text x="332" y="163" font-family="Arial,sans-serif" font-size="11" fill="#6c6253">Runtime locality signal</text><rect x="332" y="190" width="142" height="26" rx="7" fill="#f5e0bf"/><rect x="332" y="190" width="96" height="26" rx="7" fill="#d9ad67"/><text x="339" y="208" font-family="Arial,sans-serif" font-size="10" fill="#62481f">high sharing</text><rect x="332" y="235" width="142" height="26" rx="7" fill="#f0ebe4"/><rect x="332" y="235" width="46" height="26" rx="7" fill="#c8beb1"/><text x="385" y="253" font-family="Arial,sans-serif" font-size="10" fill="#6c6253">low sharing</text><text x="332" y="299" font-family="Arial,sans-serif" font-size="11" fill="#6c6253">No compiler or HW change</text>
<path d="M494 223 H548" stroke="#7c8792" stroke-width="2"/><polygon points="548,223 538,217 539,229" fill="#7c8792"/>
<rect x="548" y="107" width="178" height="232" rx="14" fill="#edf6ef" stroke="#9ac1a1"/><text x="568" y="137" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315f3a">Adaptive placement</text><rect x="568" y="165" width="138" height="60" rx="9" fill="#e2f0e5" stroke="#8ab493"/><text x="594" y="190" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#35663e">GPU memory</text><text x="589" y="210" font-family="Arial,sans-serif" font-size="10" fill="#52715a">migration / locality</text><rect x="568" y="242" width="138" height="60" rx="9" fill="#eef0f2" stroke="#abb3bc"/><text x="601" y="267" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#48535f">Zero-copy</text><text x="585" y="287" font-family="Arial,sans-serif" font-size="10" fill="#65707b">avoid migration churn</text>
</svg>
