<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">ReFlow: key idea</title><desc id="d">Key insight: the host optimizer update in CPU-offloaded training is slow because of memory traffic, not CPU math. Prior systems hide the delay by moving work to the GPU or speculating; ReFlow removes the traffic, keeps the optimizer fully offloaded, keeps training identical, and matches GPU-resident ZeRO-3 throughput.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#334155"/></marker><marker id="a-gpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-cpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f766e"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-host" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-vio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fef2f2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#fecaca" stroke-width="3"/></pattern><pattern id="hatchG" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f1f5f9"/><line x1="0" y1="0" x2="0" y2="7" stroke="#e2e8f0" stroke-width="3"/></pattern><pattern id="hatchT" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ccfbf1"/><line x1="0" y1="0" x2="0" y2="7" stroke="#99f6e4" stroke-width="3"/></pattern></defs><style>text{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style><rect width="760" height="420" fill="#ffffff"/><rect x="14.0" y="12.0" width="732.0" height="118.0" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="28.0" y="24.0" width="84.7" height="24.0" rx="12.0" fill="#2563eb" stroke="none" stroke-width="1"/><text x="70.3" y="40.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Key insight</text><text x="28.0" y="72.0" font-size="16" font-weight="800" fill="#0f172a" text-anchor="start">The CPU update is slow because of memory traffic, not CPU math.</text><rect x="28.0" y="88.0" width="112.0" height="26.0" rx="6" fill="#0d9488" stroke="none" stroke-width="1"/><text x="84.0" y="105.5" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle">Adam math 16%</text><rect x="143.0" y="88.0" width="585.0" height="26.0" rx="6" fill="url(#hatch)" stroke="#fca5a5" stroke-width="1"/><text x="435.5" y="105.5" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">memory traffic 84%: extra DRAM writes, FP32 gradients, serialized stores</text><rect x="176.0" y="142.0" width="281.0" height="28.0" rx="8" fill="#f1f5f9" stroke="none" stroke-width="1"/><text x="190.0" y="161.0" font-size="12.5" font-weight="800" fill="#334155" text-anchor="start">Prior work</text><rect x="461.0" y="142.0" width="285.0" height="28.0" rx="8" fill="#dbeafe" stroke="none" stroke-width="1"/><text x="475.0" y="161.0" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="start">ReFlow</text><line x1="14" y1="176" x2="746" y2="176" stroke="#e2e8f0"/><text x="28.0" y="198.5" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Approach</text><circle cx="198" cy="194.5" r="8" fill="#fee2e2"/><path d="M 195 191.5 L 201 197.5 M 201 191.5 L 195 197.5" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="198.5" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">Hide the delay: move work back to the</text><text x="214.0" y="214.5" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">GPU or speculate</text><circle cx="483" cy="194.5" r="8" fill="#16a34a"/><path d="M 479.4 194.7 L 482.1 197.4 L 487 191.9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="198.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Remove the delay: cut host-memory</text><text x="499.0" y="214.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">traffic at its source</text><line x1="14" y1="233.0" x2="746" y2="233.0" stroke="#e2e8f0"/><text x="28.0" y="255.5" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">GPU memory</text><circle cx="198" cy="251.5" r="8" fill="#fee2e2"/><path d="M 195 248.5 L 201 254.5 M 201 248.5 L 195 254.5" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="255.5" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">Extra GPU memory for optimizer work</text><circle cx="483" cy="251.5" r="8" fill="#16a34a"/><path d="M 479.4 251.7 L 482.1 254.4 L 487 248.9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="255.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Optimizer stays fully offloaded</text><line x1="14" y1="274.0" x2="746" y2="274.0" stroke="#e2e8f0"/><text x="28.0" y="296.5" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Training result</text><circle cx="198" cy="292.5" r="8" fill="#fee2e2"/><path d="M 195 289.5 L 201 295.5 M 201 289.5 L 195 295.5" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="296.5" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">Speculation can change the loss</text><circle cx="483" cy="292.5" r="8" fill="#16a34a"/><path d="M 479.4 292.7 L 482.1 295.4 L 487 289.9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="296.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Identical to the baseline</text><line x1="14" y1="315.0" x2="746" y2="315.0" stroke="#e2e8f0"/><text x="28.0" y="337.5" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Throughput per GPU</text><circle cx="198" cy="333.5" r="8" fill="#fee2e2"/><path d="M 195 330.5 L 201 336.5 M 201 330.5 L 195 336.5" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="337.5" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">366–439 TFLOPS</text><circle cx="483" cy="333.5" r="8" fill="#16a34a"/><path d="M 479.4 333.7 L 482.1 336.4 L 487 330.9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="337.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">681 TFLOPS, same as GPU-resident</text><text x="499.0" y="353.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">ZeRO-3 (682)</text><line x1="14" y1="372.0" x2="746" y2="372.0" stroke="#e2e8f0"/><rect x="616.3" y="386.0" width="129.7" height="24.0" rx="12.0" fill="#dcfce7" stroke="none" stroke-width="1"/><text x="681.2" y="402.3" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3× vs SuperOffload</text><rect x="445.3" y="386.0" width="163.0" height="24.0" rx="12.0" fill="#0f172a" stroke="none" stroke-width="1"/><text x="526.8" y="402.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Up to 4× vs ZeRO-Infinity</text><text x="14.0" y="402.0" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">TFLOPS: OPT-30B on 4 B200 GPUs; prior = ZeRO-Infinity, DOS, SuperOffload</text></svg>
