<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">ReplayOpt: key idea</title><desc id="d">Key insight: one optimizer step produces BF16 parameters that the GPU needs immediately and FP32 state that is needed only at the next update. ReplayOpt dispatches the parameters first and replays the FP32 write-back during GPU compute, removing it from the critical path.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#334155"/></marker><marker id="a-gpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-cpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f766e"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-host" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-vio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fef2f2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#fecaca" stroke-width="3"/></pattern><pattern id="hatchG" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f1f5f9"/><line x1="0" y1="0" x2="0" y2="7" stroke="#e2e8f0" stroke-width="3"/></pattern><pattern id="hatchT" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ccfbf1"/><line x1="0" y1="0" x2="0" y2="7" stroke="#99f6e4" stroke-width="3"/></pattern></defs><style>text{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style><rect width="760" height="420" fill="#ffffff"/><rect x="14.0" y="12.0" width="732.0" height="118.0" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="28.0" y="24.0" width="84.7" height="24.0" rx="12.0" fill="#2563eb" stroke="none" stroke-width="1"/><text x="70.3" y="40.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Key insight</text><text x="28.0" y="72.0" font-size="16" font-weight="800" fill="#0f172a" text-anchor="start">One optimizer step has two outputs with different deadlines.</text><rect x="28.0" y="86.0" width="330.0" height="30.0" rx="8" fill="#0d9488" stroke="none" stroke-width="1"/><text x="44.0" y="106.0" font-size="12.5" font-weight="800" fill="#fff" text-anchor="start">BF16 parameters</text><text x="342.0" y="106.0" font-size="11.5" font-weight="700" fill="#ccfbf1" text-anchor="end">needed by the GPU now</text><rect x="372.0" y="86.0" width="360.0" height="30.0" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1" stroke-dasharray="5 3"/><text x="388.0" y="106.0" font-size="12.5" font-weight="800" fill="#134e4a" text-anchor="start">FP32 optimizer state</text><text x="718.0" y="106.0" font-size="11.5" font-weight="600" fill="#134e4a" text-anchor="end">needed only at the next update</text><rect x="176.0" y="142.0" width="281.0" height="28.0" rx="8" fill="#f1f5f9" stroke="none" stroke-width="1"/><text x="190.0" y="161.0" font-size="12.5" font-weight="800" fill="#334155" text-anchor="start">Conventional offloaded optimizer</text><rect x="461.0" y="142.0" width="285.0" height="28.0" rx="8" fill="#dbeafe" stroke="none" stroke-width="1"/><text x="475.0" y="161.0" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="start">ReplayOpt</text><line x1="14" y1="176" x2="746" y2="176" stroke="#e2e8f0"/><text x="28.0" y="204.0" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Update order</text><circle cx="198" cy="200.0" r="8" fill="#fee2e2"/><path d="M 195 197.0 L 201 203.0 M 201 197.0 L 195 203.0" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="204.0" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">One monolithic step: update, persist FP32,</text><text x="214.0" y="220.0" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">then send parameters</text><circle cx="483" cy="200.0" r="8" fill="#16a34a"/><path d="M 479.4 200.2 L 482.1 202.9 L 487 197.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="204.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Dispatch next-step parameters first,</text><text x="499.0" y="220.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">replay the FP32 write-back later</text><line x1="14" y1="244" x2="746" y2="244" stroke="#e2e8f0"/><text x="28.0" y="272.0" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">GPU waits for</text><circle cx="198" cy="268.0" r="8" fill="#fee2e2"/><path d="M 195 265.0 L 201 271.0 M 201 265.0 L 195 271.0" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="272.0" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">The whole update, including the FP32</text><text x="214.0" y="288.0" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">write-back</text><circle cx="483" cy="268.0" r="8" fill="#16a34a"/><path d="M 479.4 268.2 L 482.1 270.9 L 487 265.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="272.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Only the parameters it needs</text><line x1="14" y1="312" x2="746" y2="312" stroke="#e2e8f0"/><text x="28.0" y="340.0" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">FP32 write-back</text><circle cx="198" cy="336.0" r="8" fill="#fee2e2"/><path d="M 195 333.0 L 201 339.0 M 201 333.0 L 195 339.0" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="340.0" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">On the critical path</text><circle cx="483" cy="336.0" r="8" fill="#16a34a"/><path d="M 479.4 336.2 L 482.1 338.9 L 487 333.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="340.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Overlapped with GPU compute</text><line x1="14" y1="364" x2="746" y2="364" stroke="#e2e8f0"/><rect x="628.7" y="386.0" width="117.3" height="24.0" rx="12.0" fill="#dbeafe" stroke="none" stroke-width="1"/><text x="687.3" y="402.3" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">no accuracy loss</text><rect x="455.3" y="386.0" width="165.3" height="24.0" rx="12.0" fill="#dcfce7" stroke="none" stroke-width="1"/><text x="538.0" y="402.3" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">55.2% less optimizer time</text><rect x="280.0" y="386.0" width="167.3" height="24.0" rx="12.0" fill="#0f172a" stroke="none" stroke-width="1"/><text x="363.6" y="402.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Up to 21.7% shorter steps</text></svg>
