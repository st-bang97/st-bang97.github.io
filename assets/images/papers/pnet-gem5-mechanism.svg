aed" stroke-width="1.6" marker-end="url(#a-vio)"/><rect x="96.0" y="250.0" width="150.0" height="100.0" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/><text x="171.0" y="268.0" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="middle">NIC</text><rect x="110.0" y="278.0" width="122.0" height="12.0" rx="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/><text x="171.0" y="288.0" font-size="10" font-weight="700" fill="#4c1d95" text-anchor="middle">Q0</text><rect x="110.0" y="294.0" width="122.0" height="12.0" rx="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/><text x="171.0" y="304.0" font-size="10" font-weight="700" fill="#4c1d95" text-anchor="middle">Q1</text><rect x="110.0" y="310.0" width="122.0" height="12.0" rx="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/><text x="171.0" y="320.0" font-size="10" font-weight="700" fill="#4c1d95" text-anchor="middle">Q2</text><rect x="110.0" y="326.0" width="122.0" height="12.0" rx="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/><text x="171.0" y="336.0" font-size="10" font-weight="700" fill="#4c1d95" text-anchor="middle">Q3</text><rect x="356.0" y="250.0" width="90.0" height="22.0" rx="5" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><text x="401.0" y="265.1" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">Core 0</text><rect x="356.0" y="276.0" width="90.0" height="22.0" rx="5" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><text x="401.0" y="291.1" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">Core 1</text><rect x="356.0" y="302.0" width="90.0" height="22.0" rx="5" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><text x="401.0" y="317.1" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">Core 2</text><rect x="356.0" y="328.0" width="90.0" height="22.0" rx="5" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><text x="401.0" y="343.1" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">Core 3</text><path d="M 246 284.0 C 300 284.0, 300 261, 352 261" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#a-vio)"/><path d="M 246 300.0 C 300 300.0, 300 287, 352 287" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#a-vio)"/><path d="M 246 316.0 C 300 316.0, 300 313, 352 313" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#a-vio)"/><path d="M 246 332.0 C 300 332.0, 300 339, 352 339" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#a-vio)"/><text x="300.0" y="364.0" font-size="11" font-weight="600" fill="#7c3aed" text-anchor="middle">per-queue MSI, one core each</text><text x="480.0" y="270.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">Simulated bandwidth</text><rect x="480.0" y="284.0" width="250.0" height="16.0" rx="8" fill="#e9eef6" stroke="none" stroke-width="1"/><rect x="480.0" y="284.0" width="250.0" height="16.0" rx="8" fill="#7c3aed" stroke="none" stroke-width="1"/><text x="480.0" y="324.0" font-size="13" font-weight="800" fill="#4c1d95" text-anchor="start">up to 46 Gbps</text><text x="480.0" y="344.0" font-size="11.5" font-weight="600" fill="#334155" text-anchor="start">Configurable packet distribution,</text><text x="480.0" y="360.0" font-size="11.5" font-weight="600" fill="#334155" text-anchor="start">decoupled from the NIC core logic</text><rect x="575.4" y="394.0" width="154.6" height="24.0" rx="12.0" fill="#0f172a" stroke="none" stroke-width="1"/><text x="652.7" y="410.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Open source on GitHub</text><rect x="30.0" y="399.0" width="14.0" height="12.0" rx="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/><text x="50.0" y="409.0" font-size="12" font-weight="500" fill="#334155" text-anchor="start">NIC queue</text><rect x="129.4" y="399.0" width="14.0" height="12.0" rx="3" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><text x="149.4" y="409.0" font-size="12" font-weight="500" fill="#334155" t