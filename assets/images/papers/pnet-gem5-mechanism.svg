<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">pNet-gem5: how it works</title><desc id="d">Comparison of the gem5 baseline NIC, which funnels packets through one queue and one core to a few Gbps, with pNet-gem5, which adds four hardware queues with per-queue MSI interrupts so four cores process packets in parallel at up to 46 Gbps.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#334155"/></marker><marker id="a-gpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-cpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f766e"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-host" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-vio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fef2f2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#fecaca" stroke-width="3"/></pattern><pattern id="hatchG" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f1f5f9"/><line x1="0" y1="0" x2="0" y2="7" stroke="#e2e8f0" stroke-width="3"/></pattern><pattern id="hatchT" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ccfbf1"/><line x1="0" y1="0" x2="0" y2="7" stroke="#99f6e4" stroke-width="3"/></pattern></defs><style>text{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style><rect width="760" height="420" fill="#ffffff"/><rect x="14.0" y="12.0" width="732.0" height="176.0" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="30.0" y="24.0" width="126.7" height="24.0" rx="12.0" fill="#e2e8f0" stroke="none" stroke-width="1"/><text x="93.3" y="40.3" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">gem5 baseline NIC</text><text x="30.0" y="82.0" font-size="11.5" font-weight="700" fill="#334155" text-anchor="start">Packets</text><line x1="30.0" y1="96.0" x2="84.0" y2="96.0" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a-vio)"/><line x1="30.0" y1="110.0" x2="84.0" y2="110.0" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a-vio)"/><line x1="30.0" y1="124.0" x2="84.0" y2="124.0" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a-vio)"/><rect x="96.0" y="62.0" width="150.0" height="100.0" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/><text x="171.0" y="80.0" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="middle">NIC</text><rect x="110.0" y="104.0" width="122.0" height="22.0" rx="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/><text x="171.0" y="119.0" font-size="11.5" font-weight="700" fill="#4c1d95" text-anchor="middle">single queue</text><rect x="356.0" y="62.0" width="90.0" height="22.0" rx="5" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><text x="401.0" y="77.1" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">Core 0</text><rect x="356.0" y="88.0" width="90.0" height="22.0" rx="5" fill="url(#hatch)" stroke="#fca5a5" s