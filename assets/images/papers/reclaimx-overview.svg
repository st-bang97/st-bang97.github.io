<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">ReclaimX overview</title><desc id="desc">A UVM far-page fault stalls a TPC. ReclaimX reassigns the stalled TPC to fine-grained victim selection and selective compression, keeping suitable data on GPU for local restore.</desc>
<rect width="760" height="420" fill="#f7f8fa"/><text x="34" y="42" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17202b">ReclaimX</text><text x="34" y="68" font-family="Arial,sans-serif" font-size="13" fill="#66717e">Use fault-stalled GPU execution for device-side memory reclamation</text>
<rect x="34" y="104" width="205" height="242" rx="14" fill="#fff" stroke="#cfd6de"/><text x="52" y="134" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#17202b">GPU / HBM</text>
<rect x="54" y="159" width="76" height="54" rx="9" fill="#e9f1fa" stroke="#7f9fc4"/><text x="72" y="181" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#204f85">TPC</text><text x="65" y="198" font-family="Arial,sans-serif" font-size="10" fill="#41698f">stalled</text>
<rect x="144" y="159" width="74" height="54" rx="9" fill="#eef0f2" stroke="#a9b0b8"/><text x="163" y="190" font-family="Arial,sans-serif" font-size="12" fill="#4e5965">TPC</text>
<g fill="#dce5ee" stroke="#aab7c5"><rect x="54" y="245" width="30" height="30" rx="4"/><rect x="89" y="245" width="30" height="30" rx="4"/><rect x="124" y="245" width="30" height="30" rx="4"/><rect x="159" y="245" width="30" height="30" rx="4"/><rect x="194" y="245" width="24" height="30" rx="4"/></g><text x="54" y="302" font-family="Arial,sans-serif" font-size="11" fill="#66717e">64 KB blocks in HBM</text>
<path d="M130 185 C276 185 274 124 360 124" fill="none" stroke="#c35b42" stroke-width="3"/><polygon points="360,124 348,118 350,131" fill="#c35b42"/><text x="250" y="111" font-family="Arial,sans-serif" font-size="11" fill="#a14634">far-page fault</text>
<rect x="358" y="93" width="188" height="124" rx="14" fill="#fff7ec" stroke="#ddb26f"/><text x="377" y="122" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7c541d">Reclaim on stalled TPC</text><text x="377" y="150" font-family="Arial,sans-serif" font-size="11" fill="#6c6253">1. 64 KB victim ordering</text><text x="377" y="172" font-family="Arial,sans-serif" font-size="11" fill="#6c6253">2. Select compressible cold block</text><text x="377" y="194" font-family="Arial,sans-serif" font-size="11" fill="#6c6253">3. Retain compressed on-device</text>
<rect x="579" y="104" width="147" height="94" rx="14" fill="#fff" stroke="#cfd6de"/><text x="599" y="133" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17202b">Host memory</text><text x="599" y="158" font-family="Arial,sans-serif" font-size="11" fill="#66717e">Avoid selected</text><text x="599" y="175" font-family="Arial,sans-serif" font-size="11" fill="#66717e">round-trip migrations</text>
<path d="M546 154 L579 154" stroke="#a8afb7" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="358" y="250" width="368" height="96" rx="14" fill="#edf6ef" stroke="#9ac1a1"/><text x="378" y="280" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315f3a">Later access: local restore on GPU</text><text x="378" y="307" font-family="Arial,sans-serif" font-size="11" fill="#58705d">Compressed-resident blocks bypass host round trips.</text><text x="378" y="328" font-family="Arial,sans-serif" font-size="11" fill="#58705d">No static reservation: reclaim only while a TPC is fault-stalled.</text>
</svg>
