<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">ReclaimX: key idea</title><desc id="d">Key insight: a far-page fault both signals that GPU memory must be freed and stalls a GPU core. Prior UVM work frees memory from the host at 2 MB granularity; ReclaimX lets the stalled core reclaim 64 KB blocks on the device, keeps cold data compressed in HBM, and uses only compute that was idle anyway.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#334155"/></marker><marker id="a-gpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-cpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f766e"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-host" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-vio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fef2f2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#fecaca" stroke-width="3"/></pattern><pattern id="hatchG" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f1f5f9"/><line x1="0" y1="0" x2="0" y2="7" stroke="#e2e8f0" stroke-width="3"/></pattern><pattern id="hatchT" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ccfbf1"/><line x1="0" y1="0" x2="0" y2="7" stroke="#99f6e4" stroke-width="3"/></pattern></defs><style>text{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style><rect width="760" height="420" fill="#ffffff"/><rect x="14.0" y="12.0" width="732.0" height="118.0" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="28.0" y="24.0" width="84.7" height="24.0" rx="12.0" fill="#2563eb" stroke="none" stroke-width="1"/><text x="70.3" y="40.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Key insight</text><text x="28.0" y="72.0" font-size="16" font-weight="800" fill="#0f172a" text-anchor="start">A page fault creates both the need to free memory and idle cores to do it.</text><rect x="28.0" y="86.0" width="150.0" height="30.0" rx="15" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/><text x="103.0" y="106.0" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">far-page fault</text><line x1="182.0" y1="101.0" x2="212.0" y2="101.0" stroke="#334155" stroke-width="1.8" marker-end="url(#a-ink)"/><rect x="216.0" y="86.0" width="170.0" height="30.0" rx="15" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="301.0" y="105.5" font-size="12.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">HBM must be freed</text><text x="398.0" y="106.0" font-size="16" font-weight="800" fill="#334155" text-anchor="middle">+</text><rect x="410.0" y="86.0" width="150.0" height="30.0" rx="15" fill="url(#hatch)" stroke="#fca5a5" stroke-width="1"/><text x="485.0" y="105.5" font-size="12.5" font-weight="600" fill="#b91c1c" text-anchor="middle">a GPU core stalls</text><line x1="564.0" y1="101.0" x2="594.0" y2="101.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a-good)"/><rect x="598.0" y="86.0" width="134.0" height="30.0" rx="15" fill="#16a34a" stroke="#16a34a" stroke-width="1"/><text x="665.0" y="105.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">let it free HBM</text><rect x="176.0" y="142.0" width="281.0" height="28.0" rx="8" fill="#f1f5f9" stroke="none" stroke-width="1"/><text x="190.0" y="161.0" font-size="12.5" font-weight="800" fill="#334155" text-anchor="start">Prior UVM work</text><rect x="461.0" y="142.0" width="285.0" height="28.0" rx="8" fill="#dbeafe" stroke="none" stroke-width="1"/><text x="475.0" y="161.0" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="start">ReclaimX</text><line x1="14" y1="176" x2="746" y2="176" stroke="#e2e8f0"/><text x="28.0" y="196.5" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Who frees memory</text><circle cx="198" cy="192.5" r="8" fill="#fee2e2"/><path d="M 195 189.5 L 201 195.5 M 201 189.5 L 195 195.5" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="196.5" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">The host CPU driver, after the fault</text><circle cx="483" cy="192.5" r="8" fill="#16a34a"/><path d="M 479.4 192.7 L 482.1 195.4 L 487 189.9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="196.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">The stalled GPU core itself, during the</text><text x="499.0" y="212.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">stall</text><line x1="14" y1="229.0" x2="746" y2="229.0" stroke="#e2e8f0"/><text x="28.0" y="249.5" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Granularity</text><circle cx="198" cy="245.5" r="8" fill="#fee2e2"/><path d="M 195 242.5 L 201 248.5 M 201 242.5 L 195 248.5" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="249.5" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">2 MB regions: evicts 1.67 MB to fetch 0.42</text><text x="214.0" y="265.5" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">MB</text><circle cx="483" cy="245.5" r="8" fill="#16a34a"/><path d="M 479.4 245.7 L 482.1 248.4 L 487 242.9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="249.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">64 KB blocks, matching the demand</text><line x1="14" y1="282.0" x2="746" y2="282.0" stroke="#e2e8f0"/><text x="28.0" y="302.5" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Evicted data</text><circle cx="198" cy="298.5" r="8" fill="#fee2e2"/><path d="M 195 295.5 L 201 301.5 M 201 295.5 L 195 301.5" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="302.5" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">Shipped to host memory and back</text><circle cx="483" cy="298.5" r="8" fill="#16a34a"/><path d="M 479.4 298.7 L 482.1 301.4 L 487 295.9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="302.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Kept compressed in HBM, restored on</text><text x="499.0" y="318.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">the GPU</text><line x1="14" y1="335.0" x2="746" y2="335.0" stroke="#e2e8f0"/><text x="28.0" y="355.5" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Compute cost</text><circle cx="198" cy="351.5" r="8" fill="#fee2e2"/><path d="M 195 348.5 L 201 354.5 M 201 348.5 L 195 354.5" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="355.5" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">Throttled or reserved cores</text><circle cx="483" cy="351.5" r="8" fill="#16a34a"/><path d="M 479.4 351.7 L 482.1 354.4 L 487 348.9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="355.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Only cores that were idle anyway</text><line x1="14" y1="372.0" x2="746" y2="372.0" stroke="#e2e8f0"/><rect x="603.3" y="386.0" width="142.7" height="24.0" rx="12.0" fill="#dbeafe" stroke="none" stroke-width="1"/><text x="674.7" y="402.3" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">90.6% fewer far faults</text><rect x="449.0" y="386.0" width="146.4" height="24.0" rx="12.0" fill="#dcfce7" stroke="none" stroke-width="1"/><text x="522.1" y="402.3" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">3.61× with prefetchers</text><rect x="281.9" y="386.0" width="159.0" height="24.0" rx="12.0" fill="#0f172a" stroke="none" stroke-width="1"/><text x="361.4" y="402.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2.33× geomean speedup</text></svg>
