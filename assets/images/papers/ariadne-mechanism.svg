<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">ARIADNE: how it works</title><desc id="d">Three mechanisms inside NVIDIA’s open-source UVM driver: pipelined fault handling hides migration latency, a runtime Sharing Degree metric measures how many threads share each region, and regions are placed in GPU memory or accessed in place through zero-copy. Average speedups over a state-of-the-art method are 1.9x, 5.0x, and 4.8x at 130%, 175%, and 300% oversubscription.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#334155"/></marker><marker id="a-gpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-cpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f766e"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-host" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-vio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fef2f2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#fecaca" stroke-width="3"/></pattern><pattern id="hatchG" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f1f5f9"/><line x1="0" y1="0" x2="0" y2="7" stroke="#e2e8f0" stroke-width="3"/></pattern><pattern id="hatchT" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ccfbf1"/><line x1="0" y1="0" x2="0" y2="7" stroke="#99f6e4" stroke-width="3"/></pattern></defs><style>text{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style><rect width="760" height="420" fill="#ffffff"/><rect x="14.0" y="12.0" width="249.6" height="24.0" rx="12.0" fill="#2563eb" stroke="none" stroke-width="1"/><text x="138.8" y="28.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Inside NVIDIA’s open-source UVM driver</text><text x="275.6" y="29.0" font-size="12" font-weight="600" fill="#334155" text-anchor="start">no recompilation, no hardware changes</text><rect x="14.0" y="48.0" width="236.0" height="262.0" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><circle cx="38" cy="68" r="10" fill="#2563eb"/><text x="38.0" y="72.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="54.0" y="73.0" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Pipelined fault handling</text><rect x="262.0" y="48.0" width="236.0" height="262.0" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><circle cx="286" cy="68" r="10" fill="#2563eb"/><text x="286.0" y="72.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="302.0" y="73.0" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Sharing Degree</text><rect x="510.0" y="48.0" width="236.0" height="262.0" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><circle cx="534" cy="68" r="10" fill="#2563eb"/><text x="534.0" y="72.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="550.0" y="73.0" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Adaptive placement</text><text x="28.0" y="102.0" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="start">serial</text><rect x="28.0" y="108.0" width="26.0" height="22.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="41.0" y="122.6" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">F1</text><rect x="54.0" y="108.0" width="40.0" height="22.0" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="74.0" y="122.6" font-size="10" font-weight="600" fill="#1e3a8a" text-anchor="middle">M1</text><rect x="94.0" y="108.0" width="26.0" height="22.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="107.0" y="122.6" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">F2</text><rect x="120.0" y="108.0" width="40.0" height="22.0" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="140.0" y="122.6" font-size="10" font-weight="600" fill="#1e3a8a" text-anchor="middle">M2</text><rect x="160.0" y="108.0" width="26.0" height="22.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="173.0" y="122.6" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">F3</text><rect x="186.0" y="108.0" width="40.0" height="22.0" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="206.0" y="122.6" font-size="10" font-weight="600" fill="#1e3a8a" text-anchor="middle">M3</text><text x="28.0" y="158.0" font-size="11.5" font-weight="700" fill="#166534" text-anchor="start">pipelined</text><rect x="28.0" y="164.0" width="26.0" height="22.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="41.0" y="178.6" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">F1</text><rect x="54.0" y="190.0" width="40.0" height="22.0" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="74.0" y="204.6" font-size="10" font-weight="600" fill="#1e3a8a" text-anchor="middle">M1</text><rect x="68.0" y="164.0" width="26.0" height="22.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="81.0" y="178.6" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">F2</text><rect x="94.0" y="190.0" width="40.0" height="22.0" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="114.0" y="204.6" font-size="10" font-weight="600" fill="#1e3a8a" text-anchor="middle">M2</text><rect x="108.0" y="164.0" width="26.0" height="22.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="121.0" y="178.6" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">F3</text><rect x="134.0" y="190.0" width="40.0" height="22.0" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="154.0" y="204.6" font-size="10" font-weight="600" fill="#1e3a8a" text-anchor="middle">M3</text><line x1="174" y1="222" x2="226" y2="222" stroke="#16a34a" stroke-width="2"/><line x1="174" y1="216" x2="174" y2="228" stroke="#16a34a" stroke-width="2"/><line x1="226" y1="216" x2="226" y2="228" stroke="#16a34a" stroke-width="2"/><text x="200.0" y="240.0" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">time saved</text><text x="28.0" y="272.0" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">F = fault handling, M = migration</text><text x="28.0" y="290.0" font-size="12" font-weight="600" fill="#334155" text-anchor="start">Hides migration latency</text><rect x="280.0" y="92.0" width="40.0" height="22.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="300.0" y="107.0" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">T0</text><rect x="332.0" y="92.0" width="40.0" height="22.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="352.0" y="107.0" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">T1</text><rect x="384.0" y="92.0" width="40.0" height="22.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="404.0" y="107.0" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">T2</text><rect x="436.0" y="92.0" width="40.0" height="22.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="456.0" y="107.0" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">T3</text><rect x="280.0" y="150.0" width="92.0" height="30.0" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="326.0" y="169.3" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">Region A</text><rect x="388.0" y="150.0" width="92.0" height="30.0" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="434.0" y="169.3" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Region B</text><path d="M 300 114 L 326 148" fill="none" stroke="#2563eb" stroke-width="1.3" marker-end="url(#a-gpu)"/><path d="M 352 114 L 326 148" fill="none" stroke="#2563eb" stroke-width="1.3" marker-end="url(#a-gpu)"/><path d="M 404 114 L 326 148" fill="none" stroke="#2563eb" stroke-width="1.3" marker-end="url(#a-gpu)"/><path d="M 456 114 L 326 148" fill="none" stroke="#2563eb" stroke-width="1.3" marker-end="url(#a-gpu)"/><path d="M 456 114 L 434 148" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#a-host)"/><rect x="280.0" y="194.0" width="92.0" height="22.0" rx="11" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/><text x="326.0" y="209.3" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">high</text><rect x="388.0" y="194.0" width="92.0" height="22.0" rx="11" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="434.0" y="209.3" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">low</text><text x="276.0" y="254.0" font-size="12" font-weight="600" fill="#334155" text-anchor="start">How many threads share a region,</text><text x="276.0" y="272.0" font-size="12" font-weight="600" fill="#334155" text-anchor="start">measured at runtime in the driver</text><text x="276.0" y="290.0" font-size="12" font-weight="600" fill="#334155" text-anchor="start">with no compiler support</text><rect x="524.0" y="92.0" width="92.0" height="26.0" rx="13" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/><text x="570.0" y="109.1" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">high sharing</text><line x1="618.0" y1="105.0" x2="638.0" y2="105.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-gpu)"/><rect x="640.0" y="88.0" width="92.0" height="36.0" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="686.0" y="110.3" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">GPU memory</text><text x="686.0" y="138.0" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="middle">migrate for reuse</text><rect x="524.0" y="168.0" width="92.0" height="26.0" rx="13" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="570.0" y="185.1" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">low sharing</text><line x1="618.0" y1="181.0" x2="638.0" y2="181.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-host)"/><rect x="640.0" y="164.0" width="92.0" height="36.0" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="686.0" y="186.3" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Zero-copy</text><text x="686.0" y="214.0" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">read host memory</text><text x="686.0" y="228.0" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">in place</text><text x="524.0" y="272.0" font-size="12" font-weight="600" fill="#334155" text-anchor="start">Avoids migration churn</text><text x="524.0" y="290.0" font-size="12" font-weight="600" fill="#334155" text-anchor="start">and thrashing under pressure</text><text x="14.0" y="340.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Average speedup over a state-of-the-art method</text><text x="14.0" y="364.0" font-size="11.5" font-weight="600" fill="#334155" text-anchor="start">130% oversubscription</text><rect x="170.0" y="354.0" width="460.0" height="12.0" rx="6" fill="#e9eef6" stroke="none" stroke-width="1"/><rect x="170.0" y="354.0" width="174.8" height="12.0" rx="6" fill="#2563eb" stroke="none" stroke-width="1"/><text x="352.8" y="364.0" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="start">1.9×</text><text x="14.0" y="384.0" font-size="11.5" font-weight="600" fill="#334155" text-anchor="start">175%</text><rect x="170.0" y="374.0" width="460.0" height="12.0" rx="6" fill="#e9eef6" stroke="none" stroke-width="1"/><rect x="170.0" y="374.0" width="460.0" height="12.0" rx="6" fill="#2563eb" stroke="none" stroke-width="1"/><text x="638.0" y="384.0" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="start">5.0×</text><text x="14.0" y="404.0" font-size="11.5" font-weight="600" fill="#334155" text-anchor="start">300%</text><rect x="170.0" y="394.0" width="460.0" height="12.0" rx="6" fill="#e9eef6" stroke="none" stroke-width="1"/><rect x="170.0" y="394.0" width="441.6" height="12.0" rx="6" fill="#2563eb" stroke="none" stroke-width="1"/><text x="619.6" y="404.0" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="start">4.8×</text></svg>
