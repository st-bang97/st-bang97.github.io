<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">pNet-gem5 overview</title><desc id="desc">pNet-gem5 models a multi-queue NIC with MSI interrupts and maps queues to multiple simulated CPU cores for parallel packet processing.</desc>
<rect width="760" height="420" fill="#f7f8fa"/><text x="34" y="42" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17202b">pNet-gem5</text><text x="34" y="68" font-family="Arial,sans-serif" font-size="13" fill="#66717e">Full-system simulation for parallel high-performance networking</text>
<rect x="34" y="123" width="160" height="188" rx="14" fill="#fff" stroke="#cfd6de"/><text x="59" y="153" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17202b">Network traffic</text><path d="M65 191 H163" stroke="#7f9fc4" stroke-width="5" stroke-linecap="round"/><path d="M65 222 H163" stroke="#7f9fc4" stroke-width="5" stroke-linecap="round"/><path d="M65 253 H163" stroke="#7f9fc4" stroke-width="5" stroke-linecap="round"/><polygon points="165,191 153,184 153,198" fill="#7f9fc4"/><polygon points="165,222 153,215 153,229" fill="#7f9fc4"/><polygon points="165,253 153,246 153,260" fill="#7f9fc4"/>
