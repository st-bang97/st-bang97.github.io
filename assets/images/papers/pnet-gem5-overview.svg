<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">pNet-gem5: key idea</title><desc id="d">Key insight: to study data-center servers, the simulator must model the parallel packet path real systems use, with one NIC queue and interrupt per core. Unlike gem5 networking, pNet-gem5 models multi-queue NICs with per-queue MSI, supports kernel networking at high bandwidth, and reaches 46 Gbps.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#334155"/></marker><marker id="a-gpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-cpu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f766e"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-host" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-vio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fef2f2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#fecaca" stroke-width="3"/></pattern><pattern id="hatchG" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f1f5f9"/><line x1="0" y1="0" x2="0" y2="7" stroke="#e2e8f0" stroke-width="3"/></pattern><pattern id="hatchT" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ccfbf1"/><line x1="0" y1="0" x2="0" y2="7" stroke="#99f6e4" stroke-width="3"/></pattern></defs><style>text{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style><rect width="760" height="420" fill="#ffffff"/><rect x="14.0" y="12.0" width="732.0" height="118.0" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="28.0" y="24.0" width="84.7" height="24.0" rx="12.0" fill="#2563eb" stroke="none" stroke-width="1"/><text x="70.3" y="40.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Key insight</text><text x="28.0" y="72.0" font-size="16" font-weight="800" fill="#0f172a" text-anchor="start">Simulate the parallel packet path real servers use: one queue per core.</text><rect x="28.0" y="86.0" width="96.0" height="30.0" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/><text x="76.0" y="105.5" font-size="12.5" font-weight="600" fill="#4c1d95" text-anchor="middle">NIC</text><line x1="126.0" y1="101.0" x2="150.0" y2="101.0" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#a-vio)"/><rect x="154.0" y="86.0" width="52.0" height="30.0" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/><text x="180.0" y="105.3" font-size="12" font-weight="600" fill="#4c1d95" text-anchor="middle">Q0</text><rect x="214.0" y="86.0" width="52.0" height="30.0" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/><text x="240.0" y="105.3" font-size="12" font-weight="600" fill="#4c1d95" text-anchor="middle">Q1</text><rect x="274.0" y="86.0" width="52.0" height="30.0" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/><text x="300.0" y="105.3" font-size="12" font-weight="600" fill="#4c1d95" text-anchor="middle">Q2</text><rect x="334.0" y="86.0" width="52.0" height="30.0" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/><text x="360.0" y="105.3" font-size="12" font-weight="600" fill="#4c1d95" text-anchor="middle">Q3</text><line x1="396.0" y1="101.0" x2="420.0" y2="101.0" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#a-vio)"/><rect x="424.0" y="86.0" width="70.0" height="30.0" rx="8" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><text x="459.0" y="105.3" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Core 0</text><rect x="502.0" y="86.0" width="70.0" height="30.0" rx="8" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><text x="537.0" y="105.3" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Core 1</text><rect x="580.0" y="86.0" width="70.0" height="30.0" rx="8" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><text x="615.0" y="105.3" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Core 2</text><rect x="658.0" y="86.0" width="70.0" height="30.0" rx="8" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><text x="693.0" y="105.3" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Core 3</text><rect x="176.0" y="142.0" width="281.0" height="28.0" rx="8" fill="#f1f5f9" stroke="none" stroke-width="1"/><text x="190.0" y="161.0" font-size="12.5" font-weight="800" fill="#334155" text-anchor="start">gem5 networking</text><rect x="461.0" y="142.0" width="285.0" height="28.0" rx="8" fill="#dbeafe" stroke="none" stroke-width="1"/><text x="475.0" y="161.0" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="start">pNet-gem5</text><line x1="14" y1="176" x2="746" y2="176" stroke="#e2e8f0"/><text x="28.0" y="196.5" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">NIC model</text><circle cx="198" cy="192.5" r="8" fill="#fee2e2"/><path d="M 195 189.5 L 201 195.5 M 201 189.5 L 195 195.5" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="196.5" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">Single queue without MSI</text><circle cx="483" cy="192.5" r="8" fill="#16a34a"/><path d="M 479.4 192.7 L 482.1 195.4 L 487 189.9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="196.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Multiple queues, each with its own MSI</text><text x="499.0" y="212.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">interrupt</text><line x1="14" y1="229.0" x2="746" y2="229.0" stroke="#e2e8f0"/><text x="28.0" y="249.5" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Kernel networking</text><circle cx="198" cy="245.5" r="8" fill="#fee2e2"/><path d="M 195 242.5 L 201 248.5 M 201 242.5 L 195 248.5" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="249.5" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">Few Gbps; the DPDK framework is</text><text x="214.0" y="265.5" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">userspace-only</text><circle cx="483" cy="245.5" r="8" fill="#16a34a"/><path d="M 479.4 245.7 L 482.1 248.4 L 487 242.9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="249.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Kernel-networked servers at high</text><text x="499.0" y="265.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">bandwidth</text><line x1="14" y1="282.0" x2="746" y2="282.0" stroke="#e2e8f0"/><text x="28.0" y="302.5" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Distribution policy</text><circle cx="198" cy="298.5" r="8" fill="#fee2e2"/><path d="M 195 295.5 L 201 301.5 M 201 295.5 L 195 301.5" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="302.5" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">Built into the NIC model</text><circle cx="483" cy="298.5" r="8" fill="#16a34a"/><path d="M 479.4 298.7 L 482.1 301.4 L 487 295.9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="302.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Decoupled and configurable for new</text><text x="499.0" y="318.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">policies</text><line x1="14" y1="335.0" x2="746" y2="335.0" stroke="#e2e8f0"/><text x="28.0" y="355.5" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Bandwidth</text><circle cx="198" cy="351.5" r="8" fill="#fee2e2"/><path d="M 195 348.5 L 201 354.5 M 201 348.5 L 195 354.5" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/><text x="214.0" y="355.5" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">A few Gbps</text><circle cx="483" cy="351.5" r="8" fill="#16a34a"/><path d="M 479.4 351.7 L 482.1 354.4 L 487 348.9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="499.0" y="355.5" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Up to 46 Gbps</text><line x1="14" y1="372.0" x2="746" y2="372.0" stroke="#e2e8f0"/><rect x="654.7" y="386.0" width="91.3" height="24.0" rx="12.0" fill="#ede9fe" stroke="none" stroke-width="1"/><text x="700.3" y="402.3" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="middle">open source</text><rect x="545.4" y="386.0" width="101.3" height="24.0" rx="12.0" fill="#0f172a" stroke="none" stroke-width="1"/><text x="596.0" y="402.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Up to 46 Gbps</text></svg>
